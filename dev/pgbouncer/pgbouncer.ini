; Local PgBouncer with the entries the platform gives ROSETTA
; (allspark platform/pgbouncer/pgbouncer.ini): transaction mode, pool 5, for
; the service; session mode, pool 1, for migrations.
[databases]
rosetta = host=postgres dbname=rosetta pool_size=5
rosetta_session = host=postgres dbname=rosetta pool_mode=session pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
max_prepared_statements = 200
server_idle_timeout = 600
ignore_startup_parameters = extra_float_digits
