# Local stack for development and tests. Not a deployment: passwords and ports
# here are throwaway values for this machine only.
#
#   docker compose -f dev/compose.yaml up -d postgres pgbouncer
#   export ROSETTA_TEST_DATABASE_URL=postgres://rosetta:rosetta@localhost:53432/rosetta
#   go test ./...
#   docker compose -f dev/compose.yaml down
#
# The whole service, with one command:
#
#   dev/keys.sh && docker compose -f dev/compose.yaml up -d --build
#
# Start only what you need: the machine runs many stacks at once.
name: rosetta-dev

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rosetta"]
      interval: 2s
      timeout: 2s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    mem_limit: 32m
    ports:
      - "127.0.0.1:53432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build: ..
    command: ["migrate"]
    environment:
      MIGRATE_DATABASE_URL: postgres://rosetta:rosetta@pgbouncer:5432/rosetta_session
    read_only: true
    depends_on:
      - pgbouncer
    restart: on-failure

  # Every service ROSETTA talks to, each under its own path prefix, with a control
  # address at /control. Never part of the image; see cmd/rosetta-standin. The
  # issuer must read the same to the browser and to ROSETTA, so the stand-in
  # gives the published address.
  standin:
    build:
      context: ..
      dockerfile: dev/standin.dockerfile
    environment:
      STANDIN_LISTEN: ":53090"
      STANDIN_PUBLIC_URL: http://localhost:53090
    mem_limit: 64m
    read_only: true
    ports:
      - "127.0.0.1:53090:53090"
    healthcheck:
      test: ["CMD", "/standin", "-healthcheck"]
      interval: 2s
      start_period: 10s

  rosetta:
    build: ..
    # PARADOX_PUBLIC_KEY for the PARADOX stand-in; make it with dev/keys.sh.
    env_file:
      - ./keys/paradox.env
    volumes:
      - ./tva:/tva:ro
    environment:
      DATABASE_URL: postgres://rosetta:rosetta@pgbouncer:5432/rosetta
      ROSETTA_BUMBLEBEE_URL: http://standin:53090/bumblebee
      ROSETTA_BUMBLEBEE_KEY: bb_standin
      ROSETTA_BIFROST_URL: http://standin:53090/bifrost
      ROSETTA_BIFROST_KEY: bf_standin
      ROSETTA_PENSIEVE_URL: http://standin:53090/pensieve
      ROSETTA_PENSIEVE_KEY: pv_standin
      ROSETTA_HEDWIG_URL: http://standin:53090/hedwig
      ROSETTA_HEDWIG_KEY: hw_test_standin
      ROSETTA_TVA_DIR: /tva
      ROSETTA_PUBLIC_URL: http://localhost:53080
      # The issuer reads the same to the browser and to ROSETTA; inside this
      # network ROSETTA reaches it at the stand-in's name.
      ROSETTA_SIGNIN_ISSUER: http://localhost:53090/mjolnir
      ROSETTA_SIGNIN_INTERNAL_URL: http://standin:53090/mjolnir
      ROSETTA_SIGNIN_CLIENT_ID: rosetta
      ROSETTA_SIGNIN_CLIENT_SECRET: local-stand-in-only
      GOMEMLIMIT: 200MiB
    mem_limit: 250m
    cpus: 1
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:53080:8080"
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 2s
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
      standin:
        condition: service_healthy
