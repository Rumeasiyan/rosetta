# Pushing a tag such as v0.1.0 builds the image and publishes it. Nothing is built on the server.
name: image
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The tag is the version in VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Read the Go the image ships
        id: go
        run: echo "version=$(sed -n 's/^FROM golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      # Dependency scanning: a known flaw that the code actually reaches stops the release
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
