# The full suite, with the database: on a version tag, before the image is built, or by hand.
# Pushing a tag such as v0.1.0 builds the image and publishes it. Nothing is built on the server.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the Go the image ships, from the Dockerfile
        id: go-version
        run: echo "version=$(sed -n 's/^FROM golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true
      - name: start the database, as dev/compose.yaml gives it
        run: docker compose -f dev/compose.yaml up -d --wait postgres pgbouncer
      - name: every test, with the database
        env:
          ROSETTA_TEST_DATABASE_URL: postgres://rosetta:rosetta@localhost:53432/rosetta
        run: go test -p 1 -count=1 ./...

  image:
    needs: full
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag is the version in VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Read the Go the image ships
        id: go
        run: echo "version=$(sed -n 's/^FROM golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      # Dependency scanning: a known flaw that the code actually reaches stops the release
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
