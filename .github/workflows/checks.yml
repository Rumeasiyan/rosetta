# One quick job on every push and pull request: format, lint, vet, build and the tests that need
# no database. The full suite runs locally before pushing, and on GitHub only for a version tag or
# by hand (release.yml).
name: checks

on:
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "docs/diagrams/*.py"
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "docs/diagrams/*.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lower-case, hyphenated names
        run: |
          bad=$(git ls-files | grep -v '^design-lab/' | grep -vE '^(README|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY|LICENSE|Makefile|Dockerfile|AGENTS|CLAUDE|VERSION)' \
            | grep -vE '(^|/)\.' | grep -vE '\.go$' | grep -vE '^docs/(STANDARDS|GETTING-STARTED|RESEARCH|ROSETTA-PRD|ROSETTA-BACKLOG|DECISION-LOG|CALLERS)\.md$' \
            | grep -E '[A-Z ]|_' || true)
          if [ -n "$bad" ]; then echo "Rename to lower-case-with-hyphens:"; echo "$bad"; exit 1; fi
      - name: no reference images, local keys or private keys
        run: |
          bad=$(git ls-files | grep -E '^design-lab/inspiration/|^dev/keys/|\.key$|\.pem$' || true)
          if [ -n "$bad" ]; then echo "These must not be committed:"; echo "$bad"; exit 1; fi
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !design-lab/**
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
      - name: gofmt
        run: |
          out=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*')); if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: the Go the image ships, from the Dockerfile
        id: go-version
        run: |
          version=$(sed -n 's/^FROM golang:\([0-9.]*\).*/\1/p' Dockerfile)
          if [ -z "$version" ]; then echo "No Go version in the Dockerfile"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Caches the module and build caches, keyed on go.sum.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true
      - run: go vet ./...
      - run: go build ./...
      # No ROSETTA_TEST_DATABASE_URL: every database test skips itself.
      - name: tests that need no database
        run: go test -count=1 ./...
