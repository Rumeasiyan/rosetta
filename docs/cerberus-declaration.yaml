# ROSETTA's levels and idle limits, in the form of CERBERUS's docs/JOINING.md.
# Give this to the administrator at joining and whenever it changes (E-ENB-10).
# ROSETTA keeps no idle timer; CERBERUS enforces these. Timed refreshes carry
# X-Timer-Request and do not count as activity. Every signed-in screen sends
# CERBERUS's activity signal to <part>/activity, or /activity at the base, so a
# person reading or typing is not signed out. No level requires a passkey.
system: EP-0009 # ROSETTA's reference in TVA's register (E-ENB-11)
level: sensitive # glossary, as an officer or keeper uses it
idle: 60
parts:
  # Grammar checks from the officer's browser. No idle limit, by the owner's
  # ruling: the editor sends no activity signal, and a person typing there is
  # active. The level's limit on a sign-in's age still applies.
  - path: /api/v2/
    level: sensitive
    idle: none
  - path: /api/v2/check
    method: OPTIONS
    open: the browser's CORS preflight carries no sign-in
  - path: /api/v2/languages
    method: OPTIONS
    open: the browser's CORS preflight carries no sign-in
  # The link in the added person's notice: someone new has no sign-in yet, and this only sends
  # them on to MJOLNIR's sign-up form.
  - path: /signin/new
    open: a person added and new to MJOLNIR has no sign-in yet
  # Other systems, each proving itself.
  - path: /api/v1/
    open: API for other systems, checked by its own key and signature
  # Administration and personal data.
  - path: /people
    level: highly_sensitive
    idle: 30
  - path: /settings
    level: highly_sensitive
    idle: 30
  - path: /gate
    level: highly_sensitive
    idle: 30
  - path: /sources
    level: highly_sensitive
    idle: 30
  - path: /status
    level: highly_sensitive
    idle: 30
  - path: /systems
    level: highly_sensitive
    idle: 30
  - path: /usage
    level: highly_sensitive
    idle: 30
  - path: /memory
    level: highly_sensitive
    idle: 30
  - path: /glossary/import
    level: highly_sensitive
    idle: 30
  - path: /glossary/export
    level: highly_sensitive
    idle: 30
